name: Build and Release

on:
  pull_request:
    paths:
      - 'installer/**'
      - 'tui/**'
      - '.github/workflows/build-and-release.yml'
      - '.trellis/spec/project/installer/**'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'installer/**'
      - 'tui/**'
      - '.github/workflows/build-and-release.yml'
      - '.trellis/spec/project/installer/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一 ref 的新 run 自动取消旧的排队 run，避免 macOS runner 排队堆积
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test-windows:
    name: Test Windows (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 安装 Bun（Windows helper 运行时测试）
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'

      - name: 运行 Windows 自更新与自卸载 helper 测试
        shell: pwsh
        working-directory: tui
        run: |
          $ErrorActionPreference = 'Stop'
          bun install --frozen-lockfile
          bun scripts/test-windows-helper.mjs
          bun scripts/test-windows-uninstall-helper.mjs

      - name: 验证 Windows PowerShell 5.1 兼容语法
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @()
          $files += Get-ChildItem '.\installer\windows' -Recurse -Filter '*.ps1'
          $buildScript = Get-Item '.\installer\build.ps1' -ErrorAction SilentlyContinue
          if ($buildScript) { $files += $buildScript }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell 5.1 语法检查失败: $($file.FullName)"
            }
            Write-Host "[PASS] $($file.FullName)"
          }

      - name: 验证 contracts JS 语法
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            '.\tui\contracts\claude-config-drift.js'
          )
          foreach ($file in $files) {
            node --check $file
            Write-Host "[PASS] $file"
          }

      - name: 运行 installer contracts 回归测试
        shell: pwsh
        run: pwsh -NoProfile -File .\installer\contracts\Test-Contracts.ps1

  test-macos:
    name: Test macOS (12+ compatible)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 验证 zsh 入口语法
        run: |
          set -eu
          zsh -n installer/macos/Install.zsh
          sh installer/build.sh --check

      - name: 验证 contracts JS 语法
        run: |
          set -eu
          for file in \
            tui/contracts/claude-config-drift.js; do
            node --check "$file"
            printf '[PASS] %s\n' "$file"
          done

  build-tui:
    name: Build TUI executables (cross-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - test-windows
      - test-macos

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 安装 Bun（TUI 构建运行时）
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'

      - name: 构建 TUI 可执行文件（三个稳定版交叉目标）
        run: |
          cd tui
          # --os=* --cpu=* 装齐所有平台的原生 optionalDependencies
          # （@opentui/core 经平台子包分发 Zig 原生内核，交叉编译时必须全部存在）
          bun install --frozen-lockfile --os=* --cpu=*

          # 使用官方 skills@latest，在隔离 HOME 验证 C/X/B 六向转换与单实体结果。
          bun run test:skills-topology

          # 发布版本以 git tag 为唯一数据源：仓库内 package.json 保持开发态版本，tag 构建时自动注入。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="$(node scripts/release-metadata.mjs --tag="${GITHUB_REF_NAME}" --package=package.json)"
            actual="$(bun src/index.tsx --version)"
            if [ "${actual}" != "${version}" ]; then
              echo "TUI 内嵌版本异常: ${actual} (期望 ${version})" >&2
              exit 1
            fi
            echo "[PASS] TUI 发布版本已注入: ${actual}"
          else
            echo "[SKIP] 非 tag 构建，保留 package.json 开发版本"
          fi

          bun scripts/build.ts --target=windows-x64
          bun scripts/build.ts --target=macos-x64
          bun scripts/build.ts --target=macos-arm64

      - name: 验证 TUI 可执行文件
        run: |
          set -eu
          expected="ccq-windows-x64.exe ccq-windows-x64.exe.gz ccq-macos-x64 ccq-macos-x64.gz ccq-macos-arm64 ccq-macos-arm64.gz"
          for file in ${expected}; do
            test -f "dist/${file}" || { echo "TUI 可执行文件不存在: ${file}" >&2; exit 1; }
            size_kb="$(du -k "dist/${file}" | cut -f1)"
            printf '[PASS] %s %s KB\n' "${file}" "${size_kb}"
          done

      - name: 上传 TUI 可执行文件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: built-tui-${{ github.sha }}
          path: |
            dist/ccq-windows-x64.exe
            dist/ccq-windows-x64.exe.gz
            dist/ccq-macos-x64
            dist/ccq-macos-x64.gz
            dist/ccq-macos-arm64
            dist/ccq-macos-arm64.gz
          retention-days: 7

  build-tui-windows-arm64:
    name: Build TUI executable (Windows ARM64 native canary)
    runs-on: windows-11-arm
    timeout-minutes: 30
    needs:
      - test-windows
      - test-macos

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 安装 Bun canary（Windows ARM64 FFI runtime）
        id: setup-bun-windows-arm64
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 'canary'
          no-cache: true

      - name: 验证 Bun Windows FFI 构建修复
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tui/scripts/verify-build-runtime.mjs --installed-revision '${{ steps.setup-bun-windows-arm64.outputs.bun-revision }}'

      - name: 构建 Windows ARM64 TUI 可执行文件
        shell: pwsh
        working-directory: tui
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --frozen-lockfile

          # 与稳定 producer 使用同一 tag 版本注入合同。
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = node scripts/release-metadata.mjs "--tag=$env:GITHUB_REF_NAME" '--package=package.json'
            $actual = bun src/index.tsx --version
            if ($actual -ne $version) {
              throw "TUI 内嵌版本异常: $actual (期望 $version)"
            }
            Write-Host "[PASS] TUI 发布版本已注入: $actual"
          } else {
            Write-Host '[SKIP] 非 tag 构建，保留 package.json 开发版本'
          }

          bun scripts/build.ts --target=windows-arm64

      - name: 验证 Windows ARM64 原生产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = '.\dist\ccq-windows-arm64.exe'
          $gzip = "$exe.gz"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "TUI 可执行文件不存在: $exe" }
          if (-not (Test-Path -LiteralPath $gzip -PathType Leaf)) { throw "TUI gzip 不存在: $gzip" }

          $expectedVersion = '0.0.0-dev'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $expectedVersion = $env:GITHUB_REF_NAME -replace '^v', '' }
          $versionOutput = @(& $exe --version 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 --version 失败: $($versionOutput -join "`n")" }
          $actualVersion = (($versionOutput | Select-Object -First 1).ToString() -replace '[^\x20-\x7E]', '').Trim()
          if ($actualVersion -ne $expectedVersion) {
            throw "Windows ARM64 可执行文件版本异常: '$actualVersion' (期望 '$expectedVersion')"
          }

          $helpOutput = @(& $exe --help 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 --help 失败: $($helpOutput -join "`n")" }

          $nonTtyOutput = @(& $exe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 non-TTY 失败: $($nonTtyOutput -join "`n")" }
          Write-Host "[PASS] Windows ARM64 原生 --version/--help/non-TTY smoke: $actualVersion"

      - name: 上传 Windows ARM64 TUI 可执行文件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: built-tui-windows-arm64-${{ github.sha }}
          path: |
            dist/ccq-windows-arm64.exe
            dist/ccq-windows-arm64.exe.gz
          retention-days: 7

  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 20
    needs:
      - test-windows
      - build-tui
      - build-tui-windows-arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 下载 TUI 可执行文件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: built-tui-${{ github.sha }}
          path: dist

      - name: 下载 Windows ARM64 TUI 可执行文件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: built-tui-windows-arm64-${{ github.sha }}
          path: dist

      - name: 清理非 Windows TUI 产物
        shell: pwsh
        run: |
          $contract = Get-Content -Raw ".\installer\contracts\build.json" | ConvertFrom-Json
          foreach ($name in @($contract.BuildEntrypoints.MacOS.Artifacts | Where-Object { $_ -ne 'install.sh' })) {
            Remove-Item -LiteralPath (Join-Path ".\dist" $name) -Force -ErrorAction SilentlyContinue
          }

      - name: 构建 Windows 单文件脚本
        shell: pwsh
        run: |
          Write-Host "PowerShell 版本: $($PSVersionTable.PSVersion)" -ForegroundColor Cyan
          & ".\installer\build.ps1" -SkipTuiBuild

      - name: 验证 Windows 构建产物
        shell: pwsh
        run: |
          $contract = Get-Content -Raw ".\installer\contracts\build.json" | ConvertFrom-Json
          $expected = @($contract.BuildEntrypoints.Windows.Artifacts | ForEach-Object { Join-Path ".\dist" $_ })
          $forbidden = @($contract.BuildEntrypoints.MacOS.Artifacts | ForEach-Object { Join-Path ".\dist" $_ })

          foreach ($path in $expected) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "构建产物不存在: $path"
            }
            Write-Host "[PASS] $path $([math]::Round((Get-Item $path).Length / 1KB, 1)) KB" -ForegroundColor Green
          }
          foreach ($path in $forbidden) {
            if (Test-Path $path -PathType Leaf) {
              throw "Windows job 不应生成此产物: $path"
            }
          }

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: built-windows-${{ github.sha }}
          path: |
            dist/install.ps1
            dist/ccq-windows-x64.exe
            dist/ccq-windows-x64.exe.gz
            dist/ccq-windows-arm64.exe
            dist/ccq-windows-arm64.exe.gz
          retention-days: 7

  smoke-windows:
    name: Smoke Windows (TUI executable)
    runs-on: windows-latest
    timeout-minutes: 10
    needs:
      - build-tui

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 下载 Windows x64 可执行文件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: built-tui-${{ github.sha }}
          path: tui-dist

      - name: Smoke 测试 Windows x64 可执行文件
        shell: pwsh
        run: |
          $exe = ".\tui-dist\ccq-windows-x64.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Windows x64 可执行文件不存在"
          }

          $expectedVersion = "0.0.0-dev"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $expectedVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          $versionOutput = @(& $exe --version 2>&1)
          $versionExitCode = $LASTEXITCODE
          $actualVersion = (($versionOutput | Select-Object -First 1).ToString() -replace '[^\x20-\x7E]', '').Trim()
          if ($versionExitCode -ne 0) {
            throw "Windows x64 可执行文件版本命令退出码异常: $versionExitCode`n$($versionOutput -join "`n")"
          }
          if ($actualVersion -ne $expectedVersion) {
            throw "Windows x64 可执行文件版本异常: '$actualVersion' (期望 '$expectedVersion')"
          }
          Write-Host "[PASS] Windows x64 可执行文件版本: $actualVersion" -ForegroundColor Green

          $helpOutput = @(& $exe --help 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "Windows x64 --help 失败: $($helpOutput -join "`n")"
          }

          # Non-TTY 模式：应输出提示并退出码 0
          $output = & $exe 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows x64 可执行文件退出码异常: $LASTEXITCODE"
          }
          Write-Host "[PASS] Windows x64 --version/--help/non-TTY smoke 通过" -ForegroundColor Green

      - name: Smoke 测试运行中 ccq.exe 自卸载
        shell: pwsh
        run: pwsh -NoProfile -File .\tui\scripts\test-windows-compiled-uninstall.ps1 -SourceExe .\tui-dist\ccq-windows-x64.exe

  build-macos:
    name: Build macOS artifacts
    runs-on: macos-latest
    timeout-minutes: 15
    needs:
      - test-macos
      - build-tui

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 下载 TUI 可执行文件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: built-tui-${{ github.sha }}
          path: dist

      - name: 清理非 macOS TUI 产物
        run: |
          windows_assets="$(node -e 'const c=require("./installer/contracts/build.json"); console.log(c.BuildEntrypoints.Windows.Artifacts.filter(x=>x!=="install.ps1").join(" "))')"
          for file in ${windows_assets}; do rm -f "dist/${file}"; done

      - name: 构建 macOS 单文件脚本
        run: |
          sh installer/build.sh --skip-tui-build

      - name: 验证 macOS 构建产物
        run: |
          set -eu
          expected="$(node -e 'const c=require("./installer/contracts/build.json"); console.log(c.BuildEntrypoints.MacOS.Artifacts.join(" "))')"
          forbidden="$(node -e 'const c=require("./installer/contracts/build.json"); console.log(c.BuildEntrypoints.Windows.Artifacts.join(" "))')"
          for file in ${expected}; do
            path="dist/${file}"
            test -f "${path}" || { echo "构建产物不存在: ${path}" >&2; exit 1; }
            printf '[PASS] %s %s KB\n' "${path}" "$(du -k "${path}" | cut -f1)"
          done
          for file in ${forbidden}; do
            path="dist/${file}"
            if [ -f "${path}" ]; then
              echo "macOS job 不应生成 Windows 产物: ${path}" >&2
              exit 1
            fi
          done
          zsh -n dist/install.sh

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: built-macos-${{ github.sha }}
          path: |
            dist/install.sh
            dist/ccq-macos-x64
            dist/ccq-macos-x64.gz
            dist/ccq-macos-arm64
            dist/ccq-macos-arm64.gz
          retention-days: 7

  smoke-macos:
    name: Smoke macOS (TUI executable)
    runs-on: macos-latest
    timeout-minutes: 10
    needs:
      - build-tui

    steps:
      - name: 下载 macOS x64 可执行文件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: built-tui-${{ github.sha }}
          path: tui-dist

      - name: Smoke 测试 macOS x64/ARM64 可执行文件
        run: |
          set -eu

          expected_version="0.0.0-dev"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected_version="${GITHUB_REF_NAME#v}"
          fi

          run_ccq() {
            target_arch="$1"
            shift
            if [ "${target_arch}" = "x64" ]; then
              arch -x86_64 "$@"
            else
              "$@"
            fi
          }

          for target_arch in x64 arm64; do
            exe="./tui-dist/ccq-macos-${target_arch}"
            test -f "${exe}" || { echo "macOS ${target_arch} 可执行文件不存在" >&2; exit 1; }
            chmod +x "${exe}"

            actual_version="$(run_ccq "${target_arch}" "${exe}" --version)"
            if [ "${actual_version}" != "${expected_version}" ]; then
              echo "macOS ${target_arch} 可执行文件版本异常: ${actual_version} (期望 ${expected_version})" >&2
              exit 1
            fi

            help_output="$(run_ccq "${target_arch}" "${exe}" --help)"
            output="$(run_ccq "${target_arch}" "${exe}" 2>&1)"
            echo "[PASS] macOS ${target_arch} --version/--help/non-TTY smoke: ${actual_version}"
          done

  release-quality:
    name: Release quality gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'

      - name: 安装依赖
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: 运行发布质量门
        working-directory: tui
        env:
          CCQ_FORMAT_BASE: HEAD^
        run: bun run check

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    needs:
      - release-quality
      - build-windows
      - build-macos
      - build-tui
      - build-tui-windows-arm64
      - smoke-windows
      - smoke-macos

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: built-windows-${{ github.sha }}
          path: dist

      - name: 下载 macOS 构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: built-macos-${{ github.sha }}
          path: dist

      - name: 下载 TUI 可执行文件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: built-tui-${{ github.sha }}
          path: dist

      - name: 下载 Windows ARM64 TUI 可执行文件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: built-tui-windows-arm64-${{ github.sha }}
          path: dist

      - name: 验证 Release artifact 集合
        run: |
          set -eu
          expected="$(node -e 'const c=require("./installer/contracts/build.json"); console.log(c.BuildEntrypoints.ReleaseArtifacts.join(" "))')"
          expected_count="$(node -e 'const c=require("./installer/contracts/build.json"); console.log(c.BuildEntrypoints.ReleaseArtifacts.length)')"
          for file in ${expected}; do
            test -f "dist/${file}" || { echo "Release 缺少 artifact: ${file}" >&2; exit 1; }
          done
          count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "${count}" != "${expected_count}" ]; then
            echo "Release artifact 数量异常: ${count} (期望 ${expected_count})" >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          fi
          # 显示可执行文件大小
          for exe in ccq-windows-x64.exe ccq-windows-arm64.exe ccq-macos-x64 ccq-macos-arm64; do
            size_kb="$(du -k "dist/${exe}" | cut -f1)"
            printf '[PASS] %s %s KB\n' "${exe}" "${size_kb}"
          done

      - name: 解析 Release 元数据
        id: release-metadata
        run: node tui/scripts/release-metadata.mjs --tag="${GITHUB_REF_NAME}" --github-output="${GITHUB_OUTPUT}"

      - name: 创建或更新 GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.release-metadata.outputs.prerelease }}
          body: |
            ## 云端一键安装

            Windows 首次安装（Windows PowerShell 5.1+，无需先装 PowerShell 7）：

            ```powershell
            Set-ExecutionPolicy Bypass -Scope Process -Force
            irm 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.ps1' | iex
            ```

            macOS 首次安装：

            ```sh
            curl -fsSL 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh' | bash
            ```

            ---

            ## 管理控制台

            安装完成后，在新终端中运行 `ccq` 进入管理控制台（TUI）：

            - 供应商管理（多供应商切换）
            - MCP Server 管理
            - Skills 管理
            - 提示词管理
            - 配置文件管理
            - 工具管理（ClaudeCode / Ccline / OpenSpec / CodeGraph / CodexCli / AntigravityCli）

            ---

            ## 文件说明

            | 文件 | 运行时要求 | 用途 |
            |------|------------|------|
            | `install.ps1` | Windows PowerShell 5.1+ | Windows 安装入口（前置检测 + 基础环境直装） |
            | `install.sh` | macOS bash → zsh | macOS 安装入口 |
            | `ccq-windows-x64.exe` | Windows x64 | ccq 管理控制台可执行文件（Windows x64） |
            | `ccq-windows-arm64.exe` | Windows ARM64 | ccq 管理控制台可执行文件（Windows ARM64） |
            | `ccq-macos-x64` | macOS Intel | ccq 管理控制台可执行文件（macOS Intel） |
            | `ccq-macos-arm64` | macOS Apple Silicon | ccq 管理控制台可执行文件（macOS Apple Silicon） |
            | `ccq-windows-x64.exe.gz` | 自更新传输 | TUI 自更新用 gzip 完整包（Windows x64） |
            | `ccq-windows-arm64.exe.gz` | 自更新传输 | TUI 自更新用 gzip 完整包（Windows ARM64） |
            | `ccq-macos-x64.gz` | 自更新传输 | TUI 自更新用 gzip 完整包（macOS Intel） |
            | `ccq-macos-arm64.gz` | 自更新传输 | TUI 自更新用 gzip 完整包（macOS Apple Silicon） |

            **注意**：install 会自动下载对应平台的 ccq 可执行文件到 PATH 目录，开新终端即可使用 `ccq` 命令。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

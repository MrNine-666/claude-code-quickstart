name: Build and Release

on:
  pull_request:
    paths:
      - 'tui/**'
      - 'installer/contracts/build.json'
      - '.github/workflows/build-and-release.yml'
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'tui/**'
      - 'installer/contracts/build.json'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccq-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Minimal build checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            tui
            installer/contracts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
        working-directory: tui
      - run: bun run check
        working-directory: tui

  build-tui:
    name: Build three stable TUI targets
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            tui
            installer/contracts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Build stable targets
        working-directory: tui
        run: |
          set -eu
          bun install --frozen-lockfile --os=* --cpu=*
          node scripts/release-metadata.mjs --tag="${GITHUB_REF_NAME}" --package=package.json
          bun scripts/build.ts --target=windows-x64
          bun scripts/build.ts --target=macos-x64
          bun scripts/build.ts --target=macos-arm64
      - name: Verify stable bytes and resolve upload paths
        id: assets
        run: node tui/scripts/release-assets.mjs --owner=stable --verify=dist --github-output="${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tui-stable-${{ github.sha }}
          path: ${{ steps.assets.outputs.paths }}
          if-no-files-found: error
          retention-days: 7

  build-windows-arm64:
    name: Build Windows ARM64 native
    if: github.ref_type == 'tag'
    needs: check
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            tui
            installer/contracts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        id: setup-bun
        with:
          bun-version: canary
          no-cache: true
      - name: Verify Windows FFI revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun tui/scripts/verify-build-runtime.mjs --installed-revision '${{ steps.setup-bun.outputs.bun-revision }}'
          if ($LASTEXITCODE -ne 0) { throw 'FFI revision validation failed' }
      - name: Build Windows ARM64
        working-directory: tui
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --frozen-lockfile
          node scripts/release-metadata.mjs "--tag=$env:GITHUB_REF_NAME" '--package=package.json'
          bun scripts/build.ts --target=windows-arm64
      - name: Verify ARM64 smoke
        run: ./tui/scripts/smoke-windows.ps1 -Executable ./dist/ccq-windows-arm64.exe -ExpectedVersion ($env:GITHUB_REF_NAME.Substring(1))
      - name: Verify ARM64 bytes and resolve upload paths
        id: assets
        run: |
          node tui/scripts/release-assets.mjs --owner=arm64 --verify=dist "--github-output=$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 asset validation failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tui-arm64-${{ github.sha }}
          path: ${{ steps.assets.outputs.paths }}
          if-no-files-found: error
          retention-days: 7

  smoke-windows:
    name: Windows x64 native smoke
    needs: build-tui
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            tui
            installer/contracts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tui-stable-${{ github.sha }}
          path: dist
      - name: Smoke Windows x64
        shell: pwsh
        run: ./tui/scripts/smoke-windows.ps1 -Executable ./dist/ccq-windows-x64.exe -ExpectedVersion ($env:GITHUB_REF_NAME.Substring(1))
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Native update helper byte replacement
        working-directory: tui
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --frozen-lockfile
          bun scripts/test-windows-helper.mjs

  smoke-macos:
    name: macOS x64/ARM64 smoke
    needs: build-tui
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tui-stable-${{ github.sha }}
          path: dist
      - name: Smoke macOS targets
        run: |
          set -eu
          for arch_name in x64 arm64; do
            exe="./dist/ccq-macos-${arch_name}"
            chmod +x "${exe}"
            run_ccq() {
              if [ "${arch_name}" = x64 ]; then arch -x86_64 "${exe}" "$@"; else "${exe}" "$@"; fi
            }
            test "$(run_ccq --version)" = "${GITHUB_REF_NAME#v}"
            run_ccq --help
            run_ccq </dev/null >/dev/null
          done

  release:
    name: Release eight TUI assets
    if: github.ref_type == 'tag'
    needs: [check, build-tui, build-windows-arm64, smoke-windows, smoke-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            tui
            installer/contracts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tui-stable-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tui-arm64-${{ github.sha }}
          path: dist
      - name: Verify exact Release set and bytes
        run: node tui/scripts/release-assets.mjs --verify=dist
      - name: Publish verified draft (retry-safe)
        run: node tui/scripts/publish-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

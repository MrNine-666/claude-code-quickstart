name: TUI Quality

on:
  pull_request:
    paths:
      - 'tui/**'
      - '.github/workflows/tui-quality.yml'
      - '.trellis/spec/backend/quality-guidelines.md'
      - '.trellis/spec/frontend/quality-guidelines.md'
      - '.trellis/spec/guides/development-workflow.md'
  push:
    branches:
      - main
    paths:
      - 'tui/**'
      - '.github/workflows/tui-quality.yml'
      - '.trellis/spec/backend/quality-guidelines.md'
      - '.trellis/spec/frontend/quality-guidelines.md'
      - '.trellis/spec/guides/development-workflow.md'

permissions:
  contents: read

concurrency:
  group: tui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TUI quality gate
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Run quality gate
        working-directory: tui
        env:
          CCQ_FORMAT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun run check
